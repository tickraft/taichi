run:
  timeout: 5m
  go: "1.26.4"

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gofmt
    - goimports
    - misspell
    - revive
    - unconvert
    - prealloc

linters-settings:
  goimports:
    local-prefixes: github.com/tickraft/taichi
  revive:
    severity: warning
    rules:
      - name: exported
        disabled: false

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gosec
